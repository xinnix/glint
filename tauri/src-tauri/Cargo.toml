[package]
name = "glint"
version = "1.4.1"
description = "GitHub CI status tray monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：widget 桌面组件需要透明窗口（macOS 上透明依赖该 feature）；
# 不走 Mac App Store 分发（DMG），无上架审查影响
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# macOS 原生通知（点击回调，插件桌面端不支持）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
# widget 桌面组件：把 NSWindow 压到桌面层级（setLevel/setCollectionBehavior）；
# tauri 本就传递依赖 objc2-app-kit，这里显式声明只开需要的 feature
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSResponder", "NSView", "objc2-quartz-core"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
