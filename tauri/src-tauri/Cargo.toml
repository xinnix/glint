[package]
name = "gitcistatus"
version = "1.0.0"
description = "GitHub CI status tray monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
keyring = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
