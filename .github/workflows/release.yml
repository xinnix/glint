name: Release

# 打 tag（v*）触发：三平台矩阵构建（macOS 通用二进制 DMG / Linux deb+AppImage /
# Windows MSI+NSIS），全部追加到同一 Draft Release，人工核对资产后发布。
# Apple Developer ID 签名与公证待账号就绪后启用（mac job 注释块）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            files: tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            files: |
              tauri/src-tauri/target/release/bundle/deb/*.deb
              tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            files: |
              tauri/src-tauri/target/release/bundle/msi/*.msi
              tauri/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # CI 上没有 tauri.conf.json 指定的 GlintLocal 签名身份，bundler 的 codesign 会失败。
      # 现造一枚同名自签证书 + 专用钥匙串。四个兼容性/稳定性要点（均已实测）：
      # ① 证书必须带 codeSigning EKU（-addext extendedKeyUsage），否则 codesign
      #    根本不把它当签名身份（"no identity found"，即使 import 显示成功）；
      # ② p12 用旧式加密参数（-macalg sha1 + PBE-SHA1-3DES），新式 AES+SHA2 MAC
      #    会被 macOS security import 拒绝（MAC verification failed）；
      # ③ 必须 set-key-partition-list 预授权：只 import 不设 partition list 时，
      #    codesign 首次使用私钥会尝试弹交互授权框——无头 runner 上永久挂起
      #    （实测 codesign 进程挂 40 分钟无输出）；
      # ④ 用专用钥匙串而非 login keychain：set-key-partition-list 需要钥匙串密码。
      # 自签证书未入信任链，对用户侧 Gatekeeper 行为与 ad-hoc 等价（首启右键打开），
      # 但产物带稳定 CFBundleIdentifier，优于裸 ad-hoc 的随机 glint-<hex> id。
      - name: Create ephemeral signing identity (GlintLocal)
        if: runner.os == 'macOS'
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 3650 -nodes -subj "/CN=GlintLocal" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=codeSigning" \
            -addext "basicConstraints=critical,CA:FALSE"
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out GlintLocal.p12 -password pass:glint-ci -macalg sha1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES
          KC="$HOME/Library/Keychains/glint-build.keychain"
          security create-keychain -p glint-ci "$KC"
          security unlock-keychain -p glint-ci "$KC"
          security import GlintLocal.p12 -k "$KC" -P glint-ci -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple-signing -k glint-ci "$KC"
          security list-keychains -s "$KC" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -p codesigning "$KC" || true

      # Developer ID 签名就绪后替换上方临时证书步骤：
      # - name: Import signing certificate
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}        # base64 的 .p12
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   run: |
      #     echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
      #     security create-keychain -p "" build.keychain
      #     security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple-signing -k "" build.keychain
      #     security default-keychain -s build.keychain

      - name: Build
        working-directory: tauri
        timeout-minutes: 30
        env:
          # runner 无 FUSE，AppImage 工具链需要自解压模式（非 Linux 平台无副作用）
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          npm ci
          npx tauri build ${{ matrix.tauri_args }}

      # 公证就绪后取消注释（需 APPLE_ID / APPLE_PASSWORD[app-specific] / APPLE_TEAM_ID secrets）
      # - name: Notarize
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     APP="tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/Glint.app"
      #     codesign --deep --force --options runtime --sign "Developer ID Application: <NAME> (<TEAMID>)" "$APP"
      #     ditto -c -k --keepParent "$APP" Glint.zip
      #     xcrun notarytool submit Glint.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
      #     xcrun stapler staple "$APP"

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.files }}
