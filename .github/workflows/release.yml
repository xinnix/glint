name: Release

# 打 tag（v*）触发：三平台矩阵构建（macOS 通用二进制 DMG / Linux deb+AppImage /
# Windows MSI+NSIS），全部追加到同一 Draft Release，人工核对资产后发布。
# Apple Developer ID 签名与公证待账号就绪后启用（mac job 注释块）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            files: tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            files: |
              tauri/src-tauri/target/release/bundle/deb/*.deb
              tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            files: |
              tauri/src-tauri/target/release/bundle/msi/*.msi
              tauri/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # CI 上没有 tauri.conf.json 指定的 GlintLocal 签名身份，bundler 的 codesign 会失败。
      # 方案：现造一枚自签证书，经 tauri-bundler 原生的 APPLE_CERTIFICATE 机制签名——
      # bundler 检测到该环境变量后会自建临时钥匙串（create/unlock/keychain-settings/
      # partition-list 一应俱全）并用显式 --keychain 路径签名，完全绕开搜索链与交互授权。
      # 勿用手搓 security 命令替代：codesign 首次用私钥若触发任何交互授权/解锁弹窗，
      # headless runner 上无人应答即永久挂起（实测挂 40 分钟）。
      # 自签证书两个硬性要点（源码级确认 + 本地实测）：
      # ① CN 必须带 Apple 前缀且带 OU——bundler 只认 "Developer ID Application:" 等前缀
      #   身份且要求 OU 字段（identity::list 按 find-certificate -c 前缀过滤 + Team 解析）；
      # ② codeSigning EKU 缺失时 codesign 根本不把它当签名身份（"no identity found"）；
      # ③ p12 用旧式加密参数（-macalg sha1 + PBE-SHA1-3DES），新式 AES+SHA2 MAC 会被
      #   macOS security import 拒（MAC verification failed）。
      # 自签证书未入信任链，对用户侧 Gatekeeper 行为与 ad-hoc 等价（首启右键打开），
      # 但产物带稳定 CFBundleIdentifier，优于裸 ad-hoc 的随机 glint-<hex> id。
      # 将来拿到真 Developer ID 证书后：仅需把 secrets 里同名 APPLE_CERTIFICATE(_PASSWORD)
      # 覆盖本步骤的 GITHUB_ENV 输出即可，下游零改动。
      - name: Create ephemeral signing certificate (GlintLocal)
        if: runner.os == 'macOS'
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 3650 -nodes \
            -subj "/CN=Developer ID Application: GlintLocal/OU=GlintCI" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=codeSigning" \
            -addext "basicConstraints=critical,CA:FALSE"
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out GlintLocal.p12 -password pass:glint-ci -macalg sha1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES
          {
            echo "APPLE_CERTIFICATE=$(base64 -i GlintLocal.p12 | tr -d '\n')"
            echo "APPLE_CERTIFICATE_PASSWORD=glint-ci"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: tauri
        timeout-minutes: 30
        env:
          # runner 无 FUSE，AppImage 工具链需要自解压模式（非 Linux 平台无副作用）
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          npm ci
          npx tauri build ${{ matrix.tauri_args }}

      # 公证就绪后取消注释（需 APPLE_ID / APPLE_PASSWORD[app-specific] / APPLE_TEAM_ID secrets）
      # - name: Notarize
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     APP="tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/Glint.app"
      #     codesign --deep --force --options runtime --sign "Developer ID Application: <NAME> (<TEAMID>)" "$APP"
      #     ditto -c -k --keepParent "$APP" Glint.zip
      #     xcrun notarytool submit Glint.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
      #     xcrun stapler staple "$APP"

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.files }}
